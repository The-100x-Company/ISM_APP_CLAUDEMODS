<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nivel en Claude · Equipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#0D0E11;--panel:#13151A;--ink:#E6E8EA;--ink2:#A9ADB1;--ink3:#84888E;--line:#24272A;--line2:#3A3E43;--acc:#6D92D6;--warm:#E9D25B;
--l1:#2A2D33;--l2:#34445F;--l3:#4A6799;--l4:#6D92D6;--l5:#E9D25B}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 "Host Grotesk",system-ui,sans-serif}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
main{max-width:1240px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
h1{font-size:26px;font-weight:600;margin:0;letter-spacing:-.01em}
h1 span{color:var(--ink3);font-weight:400}
h2{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:var(--ink3);margin:0 0 12px}
.meta{color:var(--ink3);font-size:12px}
.kpis{display:flex;gap:40px;flex-wrap:wrap;margin:22px 0 26px}
.kpi b{display:block;font-size:40px;font-weight:600;line-height:1}
.kpi small{color:var(--ink3);font-size:12px}
.grid{display:grid;grid-template-columns:340px 1fr;gap:24px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select{background:var(--paper);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);cursor:pointer;white-space:nowrap;user-select:none}
th.num,td.num{text-align:right}
th[data-dir=asc]::after{content:" ↑"}th[data-dir=desc]::after{content:" ↓"}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:#171a20}
tr.open td{background:#171a20}
.bar{display:inline-block;width:56px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.tier{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2)}
.tier.Competente{border-color:var(--acc);color:var(--acc)}
.tier.Avanzado,.tier.Experto{border-color:var(--warm);color:var(--warm)}
.warn{color:var(--warm);font-size:11px;margin-left:6px}
.drill td{padding:12px 8px 16px;white-space:normal}
.drillgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.drillgrid{grid-template-columns:1fr 1fr}}
.drillgrid h3{font-size:12px;margin:0 0 6px;font-weight:500;color:var(--ink2)}
.m{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:1px 0}
.dots{letter-spacing:1px}
.heat{overflow-x:auto}
.heat table td,.heat table th{padding:0;border:none;text-align:center}
.heat th.v{height:118px;vertical-align:bottom;cursor:default}
.heat th.v div{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;color:var(--ink3);padding:4px 0}
.heat td.c{min-width:26px;height:22px;font-size:9.5px;color:#0D0E11;border:1px solid var(--paper)}
.heat td.n{text-align:left;padding-right:10px;font-size:12px;color:var(--ink2)}
.heat tr.avg td.n{color:var(--ink);font-weight:600}
.heat th.sep,.heat td.sep{width:8px}
.heat .cat{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.1em;text-align:left;padding:0 0 4px}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--ink3);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:middle}
.missing{color:var(--ink3);font-size:12px;margin-top:10px}
section{margin-top:24px}
</style>
</head>
<body>
<main>
<header>
  <h1>Tu Nivel en Claude <span>· Equipo ISMO</span></h1>
  <div class="meta mono" id="corte"></div>
</header>
<div class="kpis" id="kpis"></div>

<div class="grid">
  <div class="card">
    <h2>Perfil del equipo</h2>
    <svg id="spider" viewBox="0 0 400 300" width="100%" style="max-width:380px;display:block;margin:0 auto"></svg>
  </div>
  <div class="card">
    <h2>Ranking</h2>
    <div class="tools">
      <input id="q" placeholder="Filtrar persona" aria-label="Filtrar persona">
      <select id="fnivel" aria-label="Filtrar nivel"><option value="">Todos los niveles</option></select>
    </div>
    <div style="overflow-x:auto"><table id="rank"><thead></thead><tbody></tbody></table></div>
  </div>
</div>

<section class="card heat">
  <h2>Mapa de métricas · nivel 1 a 5</h2>
  <div id="heat"></div>
  <div class="legend" id="legend"></div>
</section>
</main>

<script>
const CATS=[['herramienta','Herramienta',.3],['estructura','Estructura',.3],['sistema','Sistema',.2],['valor','Valor',.2]];
const METRICAS={
 herramienta:['adopcion','frecuencia','jornada','sesiones','profundidad','consumo','variedad','contexto','planificacion','skills','conectores','conduccion','escritorio'],
 estructura:['objetivo','contexto_negocio','criterios','edge_cases','exploracion','verificacion','iteracion','descomposicion','precision'],
 sistema:['delegacion','automatizacion','comandos','construccion','documentacion','sops','loops','recursividad','generalizacion'],
 valor:['kpis','metrica_exito','linea_base','roi','prioridad','cierre']};
const ETIQUETA={adopcion:'Adopción',planificacion:'Planificación',conduccion:'Conducción',delegacion:'Delegación',automatizacion:'Automatización',construccion:'Construcción',documentacion:'Documentación',contexto_negocio:'Contexto negocio',edge_cases:'Casos borde',exploracion:'Exploración',verificacion:'Verificación',iteracion:'Iteración',descomposicion:'Descomposición',precision:'Precisión',generalizacion:'Generalización',sops:'SOPs',kpis:'KPIs',roi:'ROI',metrica_exito:'Métrica de éxito',linea_base:'Línea base'};
const et=id=>ETIQUETA[id]||id.charAt(0).toUpperCase()+id.slice(1);
const nombre=c=>c.split('@')[0].split('.').map(s=>s.charAt(0).toUpperCase()+s.slice(1)).join(' ');
const COLOR=['','var(--l1)','var(--l2)','var(--l3)','var(--l4)','var(--l5)'];
const fmt=new Intl.NumberFormat('es-MX');
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const avg=a=>{a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};

// URL es el estado: orden, filtro y persona abierta viven en la query.
const P=new URLSearchParams(location.search);
let estado={orden:P.get('orden')||'puntaje',dir:P.get('dir')||'desc',q:P.get('q')||'',nivel:P.get('nivel')||'',abierta:P.get('p')||''};
function guarda(){const u=new URLSearchParams();for(const[k,v]of Object.entries({orden:estado.orden,dir:estado.dir,q:estado.q,nivel:estado.nivel,p:estado.abierta}))if(v)u.set(k,v);history.replaceState(null,'','?'+u)}

// Fuente de datos: local = datos.json; producción = vista x100_masters.ranking detrás de login.
fetch('datos.json',{cache:'no-store'}).then(r=>r.json()).then(pinta).catch(e=>{document.getElementById('kpis').textContent='No se pudo leer datos.json: '+e});

function pinta(D){
  const gente=D.personas;
  document.getElementById('corte').textContent='Corte '+new Date(D.ahora).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})+' (hora local)';
  const prom=avg(gente.map(p=>p.puntaje));
  document.getElementById('kpis').innerHTML=
    `<div class="kpi"><b>${Math.round(prom)}</b><small>puntaje promedio</small></div>`+
    `<div class="kpi"><b>${gente.length}<span style="font-size:20px;color:var(--ink3)"> / ${D.roster}</span></b><small>personas con datos</small></div>`+
    `<div class="kpi"><b>${fmt.format(gente.reduce((t,p)=>t+p.prompts,0))}</b><small>prompts analizados</small></div>`;

  spider(CATS.map(([k])=>avg(gente.map(p=>p.categorias[k]))));

  const niveles=[...new Set(gente.map(p=>p.nivel))];
  const sel=document.getElementById('fnivel');
  niveles.forEach(n=>sel.insertAdjacentHTML('beforeend',`<option>${esc(n)}</option>`));
  sel.value=estado.nivel;const q=document.getElementById('q');q.value=estado.q;
  sel.onchange=()=>{estado.nivel=sel.value;guarda();tabla(D)};
  q.oninput=()=>{estado.q=q.value;guarda();tabla(D)};
  tabla(D);heat(D);
}

function spider(vals){
  const cx=200,cy=150,R=100,n=vals.length,s=document.getElementById('spider');
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g='';
  for(const f of[.25,.5,.75,1])g+=`<polygon points="${vals.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  vals.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`});
  const poly=vals.map((v,i)=>pt(i,R*(v||0)/100).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(109,146,214,.22)" stroke="var(--acc)" stroke-width="1.5"><animate attributeName="opacity" from="0" to="1" dur=".8s"/></polygon>`;
  vals.forEach((v,i)=>{const[x,y]=pt(i,R+22);const anchor=Math.abs(x-cx)<5?'middle':x>cx?'start':'end';
    g+=`<text x="${x}" y="${y}" text-anchor="${anchor}" fill="var(--ink2)" font-size="12">${CATS[i][1]}</text><text x="${x}" y="${y+15}" text-anchor="${anchor}" fill="var(--ink)" font-size="14" font-weight="600">${v==null?'–':Math.round(v)}</text>`});
  s.innerHTML=g;
}

function tabla(D){
  const cols=[['nombre','Persona'],['puntaje','Puntaje','num'],['nivel','Nivel'],...CATS.map(([k,l])=>[k,l]),['dias','Días','num'],['prompts','Prompts','num']];
  const th=document.querySelector('#rank thead');
  th.innerHTML='<tr>'+cols.map(([k,l,c])=>`<th class="${c||''}" data-k="${k}" ${estado.orden===k?`data-dir="${estado.dir}"`:''}>${l}</th>`).join('')+'</tr>';
  th.querySelectorAll('th').forEach(t=>t.onclick=()=>{const k=t.dataset.k;estado.dir=estado.orden===k&&estado.dir==='desc'?'asc':'desc';estado.orden=k;guarda();tabla(D)});
  const val=(p,k)=>k==='nombre'?nombre(p.correo):CATS.some(c=>c[0]===k)?p.categorias[k]??-1:p[k];
  let filas=D.personas.filter(p=>(!estado.nivel||p.nivel===estado.nivel)&&nombre(p.correo).toLowerCase().includes(estado.q.toLowerCase()));
  filas.sort((a,b)=>{const x=val(a,estado.orden),y=val(b,estado.orden);const r=typeof x==='string'?x.localeCompare(y,'es'):x-y;return estado.dir==='asc'?r:-r});
  const tb=document.querySelector('#rank tbody');
  tb.innerHTML=filas.map(p=>{
    const id=p.correo.split('@')[0],open=estado.abierta===id;
    const corto=p.dias<3?`<span class="warn" title="Menos de 3 días de datos: el puntaje todavía no es representativo">● ${p.dias} d</span>`:'';
    let h=`<tr class="row${open?' open':''}" data-id="${id}"><td>${esc(nombre(p.correo))}${corto}</td><td class="num mono"><b>${p.puntaje}</b></td><td><span class="tier ${esc(p.nivel)}">${esc(p.nivel)}</span></td>`+
      CATS.map(([k])=>{const v=p.categorias[k];return`<td class="mono">${v==null?'<span style="color:var(--ink3)">–</span>':`<span class="bar"><i style="width:${v}%"></i></span>${v}`}</td>`}).join('')+
      `<td class="num mono">${p.dias}</td><td class="num mono">${fmt.format(p.prompts)}</td></tr>`;
    if(open)h+=`<tr class="drill"><td colspan="${cols.length}">${drill(p,D.niveles[p.correo]||{})}</td></tr>`;
    return h}).join('');
  tb.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>{estado.abierta=estado.abierta===r.dataset.id?'':r.dataset.id;guarda();tabla(D)});
}

function spark(serie){
  const v=serie.map(x=>x??null),w=120,h=24,n=v.length;if(n<2)return'';
  const pts=v.map((y,i)=>y==null?null:[i*w/(n-1),h-(y/100)*h]).filter(Boolean);
  return`<svg width="${w}" height="${h}" style="display:block;margin:2px 0 6px"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="1.4"/></svg>`;
}
function drill(p,nv){
  return'<div class="drillgrid">'+CATS.map(([k,l])=>{
    const met=METRICAS[k].map(m=>[m,nv[m]]).sort((a,b)=>(a[1]??0)-(b[1]??0));
    return`<div><h3>${l} · ${p.categorias[k]??'–'}</h3>${spark(p.tendencia[k]||[])}`+
      met.map(([m,v])=>`<div class="m"><span>${et(m)}</span><span class="dots" style="color:${v==null?'var(--ink3)':COLOR[v]==='var(--l1)'?'var(--ink3)':COLOR[v]}">${v==null?'sin dato':'●'.repeat(v)+'<span style="color:var(--line2)">'+'●'.repeat(5-v)+'</span>'}</span></div>`).join('')+'</div>'}).join('')+'</div>';
}

function heat(D){
  const gente=[...D.personas].sort((a,b)=>b.puntaje-a.puntaje);
  let head1='<tr><th></th>',head2='<tr><th></th>';
  CATS.forEach(([k,l],ci)=>{if(ci)head1+='<th class="sep"></th>',head2+='<th class="sep"></th>';
    head1+=`<th class="cat" colspan="${METRICAS[k].length}">${l}</th>`;
    METRICAS[k].forEach(m=>head2+=`<th class="v"><div>${et(m)}</div></th>`)});
  const celda=v=>v==null?`<td class="c" style="background:transparent;color:var(--ink3)">·</td>`:`<td class="c" style="background:${COLOR[Math.round(v)]};color:${v>=3.5?'#0D0E11':'var(--ink)'}" title="${v}">${Number.isInteger(v)?v:v.toFixed(1)}</td>`;
  const fila=(n,get,cls='')=>`<tr class="${cls}"><td class="n">${n}</td>`+CATS.map(([k],ci)=>(ci?'<td class="sep"></td>':'')+METRICAS[k].map(m=>celda(get(m))).join('')).join('')+'</tr>';
  let body=gente.map(p=>fila(esc(nombre(p.correo)),m=>(D.niveles[p.correo]||{})[m])).join('');
  body+=fila('Promedio equipo',m=>{const a=avg(gente.map(p=>(D.niveles[p.correo]||{})[m]));return a==null?null:Math.round(a*10)/10},'avg');
  document.getElementById('heat').innerHTML=`<table><thead>${head1}</tr>${head2}</tr></thead><tbody>${body}</tbody></table>`;
  document.getElementById('legend').innerHTML=[1,2,3,4,5].map(n=>`<span><i style="background:${COLOR[n]}"></i>${n}</span>`).join('')+'<span>· sin dato</span>';
}
</script>
</body>
</html>
